#cloud-config
groups:
  - debian: [root, sys]

users:
  - default
  - name: ${LINUX_HUMAN_USERNAME}
    gecos: Human Developer User - ${LINUX_HUMAN_USERNAME}
    shell: /bin/bash
    primary_group: ${LINUX_HUMAN_USERNAME}
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin, docker
    lock_passwd: true
    ssh_authorized_keys: ${LINUX_HUMAN_SSHKEY}

  - name: ${LINUX_BOTCICDGHA_USERNAME}
    gecos: GitHub Actions CI/CD Bot - ${LINUX_BOTCICDGHA_USERNAME}
    shell: /bin/bash
    primary_group: ${LINUX_BOTCICDGHA_USERNAME}
    # gives passwordless sudo access specifically to docker and docker-compose commands
    sudo: ALL=(ALL) NOPASSWD:/usr/bin/docker,/usr/bin/docker-compose
    groups: docker
    lock_passwd: true
    ssh_authorized_keys: ${LINUX_CICDGHA_SSHKEY}

# Disable SSH password authentication
ssh_pwauth: false

package_update: true
package_upgrade: true
packages:
  - zsh
  - git
  - make
  - rsync
  - ufw
  - fail2ban

write_files:
  # Create kernel hardening configuration file
  # This file configures low-level network security settings that are applied at boot
  # These settings protect against DDoS attacks, IP spoofing, and packet manipulation
  # Location: /etc/sysctl.d/ is the standard directory for kernel parameter overrides
  # The "99-" prefix ensures this loads last, overriding any earlier configs
  - path: /etc/sysctl.d/99-hardening.conf
    permissions: '0644'
    content: |
      # Kernel hardening for DigitalOcean droplet
      
      # CRITICAL: SYN flood protection (protects against DDoS)
      # Enables SYN cookies to prevent attackers from exhausting connection queue
      # When connection queue fills, kernel uses stateless cookies instead of allocating memory
      # Transparent to legitimate clients, stops SYN flood attacks cold
      net.ipv4.tcp_syncookies = 1
      
      # IMPORTANT: IP spoofing protection
      # Reverse path filtering checks if packets could plausibly arrive on their interface
      # Drops packets claiming to be from IPs that wouldn't route back this way
      # Blocks spoofed private IPs, localhost, and other impossible source addresses
      net.ipv4.conf.all.rp_filter = 1
      net.ipv4.conf.default.rp_filter = 1
      
      # USEFUL: Log suspicious packets for monitoring
      # "Martian" packets have impossible source/dest addresses (private IPs on public interface, etc.)
      # Logging creates audit trail of attack attempts without blocking (rp_filter already blocks them)
      net.ipv4.conf.all.log_martians = 1
      
      # DEFENSE IN DEPTH: Disable features not needed in cloud environment
      # These features are rarely used legitimately in modern cloud setups
      # Disabling eliminates potential attack vectors at zero performance cost
      
      # ICMP redirects: Routers can tell us to use different routes
      # Not needed with simple single-interface, single-gateway topology
      # Can be abused for man-in-the-middle attacks, so disable
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv6.conf.all.accept_redirects = 0
      net.ipv6.conf.default.accept_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
      
      # Source routing: Sender specifies exact path through network
      # Almost never used legitimately, can bypass firewalls
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv4.conf.default.accept_source_route = 0
      net.ipv6.conf.all.accept_source_route = 0
      net.ipv6.conf.default.accept_source_route = 0

  # Create fail2ban SSH jail configuration for Debian 12
  # Using jail.d override instead of modifying jail.local to avoid duplicate sections
  # Files in /etc/fail2ban/jail.d/ override settings in jail.conf and jail.local
  # This is the Debian 12 best practice and prevents configuration conflicts
  - path: /etc/fail2ban/jail.d/sshd.local
    permissions: '0644'
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 3
      bantime = 600
      findtime = 600

runcmd:
  # Install Docker using the official script
  - curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
  - sh /tmp/get-docker.sh
  - rm /tmp/get-docker.sh
  
  # Add human user to docker group (for interactive sessions)
  - usermod -aG docker ${LINUX_HUMAN_USERNAME}
  
  # Configure UFW firewall (Layer 2)
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  
  # Log UFW status for verification
  - ufw status verbose
  
  # Start and enable fail2ban service (Layer 3)
  # Configuration is already in place via /etc/fail2ban/jail.d/sshd.local
  - systemctl enable fail2ban
  - systemctl start fail2ban
  
  # Apply kernel hardening settings from the config file we created above (Layer 5)
  # The -p flag loads settings from the specified file
  # Settings take effect immediately and persist across reboots (because file is in /etc/sysctl.d/)
  - sysctl -p /etc/sysctl.d/99-hardening.conf